version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Branches and dependency version upgrades are maintained manually.
    open-pull-requests-limit: 0
  - package-ecosystem: nuget
    directory: /源码/Emuera
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      compatible-updates:
        update-types: [minor, patch]
