version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: nuget
    directory: /源码/Emuera
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        update-types: [minor, patch]
