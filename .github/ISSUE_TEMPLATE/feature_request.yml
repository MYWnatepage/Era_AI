name: 功能建议
description: 描述希望解决的问题和期望的使用方式。
title: '[建议] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 目前遇到什么问题？
      description: 请描述具体场景，便于判断这个功能的用途。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或补充资料
      description: 可选；请勿附带私人数据或无授权素材。
