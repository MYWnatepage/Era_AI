# model_profiles.ini
# 常用模型配置列表
#
# 说明：
#   启动游戏时，start_game.bat 会调用 AI/select_model.py。
#   select_model.py 会读取本文件，让你选择一个模型配置。
#   选择后会自动生成 AI/AI_CONFIG.txt。
#
# 注意：
#   DISPLAY_NAME 只用于启动器显示，不会写入 AI_CONFIG.txt。
#   OpenAI API Key 不要截图，不要发给别人。

[MOCK]
DISPLAY_NAME=mock 测试模式
MODEL_SOURCE=mock
MOCK_MODEL_NAME=mock-test

[GX_DEEPSEEK]
DISPLAY_NAME=GX - deepseek-v4-flash
MODEL_SOURCE=gx
GX_MODEL_NAME=deepseek-v4-flash
GX_API_BASE_URL=http://172.16.16.20:8000/v1
GX_API_KEY=EMPTY

[OPENAI_MINI]
DISPLAY_NAME=OpenAI - gpt-4.1-mini
MODEL_SOURCE=openai
OPENAI_MODEL=gpt-4.1-mini
OPENAI_API_BASE_URL=https://api.openai.com/v1
OPENAI_API_KEY=EMPTY
